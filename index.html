<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بشار الدرويش | حساباتي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    min-height: 100vh;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 35px 24px;
    text-align: center;
    background: #141414;
    border: 1px solid #393020;
    border-radius: 24px;
    box-shadow: 0 15px 45px #000;
}

.photo {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    border: 3px solid #c9a45c;
    object-fit: cover;
    background: #292929;
}

h1 {
    color: #d6b66f;
    font-size: 27px;
    margin: 18px 0 8px;
}

.bio {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 28px;
}

.social {
    display: block;
    text-decoration: none;
    color: white;
    background: #202020;
    border: 1px solid #49402f;
    border-radius: 12px;
    padding: 15px;
    margin: 13px 0;
    transition: 0.3s;
    font-size: 16px;
}

.social:hover {
    background: #c9a45c;
    color: black;
}

footer {
    color: #777;
    font-size: 12px;
    margin-top: 28px;
}
</style>
</head>

<body>

<div class="container">

<img class="photo"
src="https://placehold.co/200x200/222222/c9a45c?text=B"
alt="صورة بشار">

<h1>بشار الدرويش</h1>

<p class="bio">
مرحباً بك في عالمي الرقمي
</p>

<a class="social" href="https://tiktok.com/" target="_blank">TikTok</a>

<a class="social" href="https://youtube.com/" target="_blank">YouTube</a>

<a class="social" href="https://wa.me/" target="_blank">WhatsApp</a>

<footer>

</footer>

</div>

</html>
